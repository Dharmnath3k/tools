    <!-- GitHub Pages Single Page Apps redirection receiver -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {

            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");

            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
